<style>
:root{--bg:#0e1014;--card:#161920;--s2:#1d212a;--ink:#e8eaee;--mute:#808896;--line:#252a34;--acc:#e6c35c;--on:#14120a;--neg:#e5786d;--pos:#5fc79a;color-scheme:dark}
:root[data-t=light]{--bg:#f3f4f6;--card:#fff;--s2:#eceef1;--ink:#14171c;--mute:#667085;--line:#e2e5ea;--acc:#b8901f;--on:#fff;--neg:#c9483c;--pos:#18915f;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:13.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
.i{width:1.25em;height:1.25em;flex:none;display:block}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px}
.top{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;min-height:34px}.tr{display:flex;justify-self:end}
.top>b{font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:center}
.top button{background:none;border:0;width:34px;height:34px;font-size:20px;border-radius:10px;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.top button,.x{background:none;border:0;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;font-size:16px;border-radius:9px;color:var(--ink)}



.hs{display:flex;align-items:center;gap:4px;margin-top:0}.hs>div{flex:1;min-width:0;padding:0 4px}
.mp{flex:none;background:var(--s2);border:0;border-radius:10px;padding:5px 8px 5px 10px;text-align:center;color:var(--ink);cursor:pointer;min-width:70px;line-height:1.2}.mp small{display:block;color:var(--mute);font-size:11px;margin:0}.mp span{display:flex;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600}.mp .i{width:14px;height:14px;color:var(--mute)}
.hs>div small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}.hs b{font-size:16px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yr{display:flex;justify-content:center;align-items:center;gap:16px;margin:10px 0;font-size:16px}.yr .x{width:36px;height:36px;padding:0}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}.mg button.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
main{max-width:560px;margin:0 auto;padding:2px 14px}
.day{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:11px;font-weight:500;padding:16px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.item .t{flex:1;min-width:0;font-weight:500}.item .t small{display:block;color:var(--mute);font-weight:400;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item>b{font-weight:600}
.ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--s2);color:var(--c,var(--mute))}
@supports(background:color-mix(in srgb,red 10%,transparent)){.ic{background:color-mix(in srgb,var(--c,#888) 15%,transparent)}}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.empty{text-align:center;color:var(--mute);padding:44px 12px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom,0px) + 4px)}
nav>button{background:none;border:0;color:var(--mute);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;cursor:pointer}
nav>button.on{color:var(--acc)}.ni{font-size:18px;display:block;line-height:0}
nav #add{justify-self:center;width:42px;height:42px;border-radius:14px;background:var(--acc);color:var(--on);font-size:20px;display:grid;place-items:center;margin-top:-14px;padding:0;box-shadow:0 4px 14px #0007}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px;margin:10px 0;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:6px 4px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--s2);color:var(--ink);font-weight:650;box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 4px;font-size:13px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card .row+.row{margin-top:5px}
.bar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:3px}
.cr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.cr>div:last-child{flex:1;min-width:0}
.f{font-size:16px;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px;min-width:0}
.btn{font-size:14px;font-weight:600;width:100%;padding:10px;border-radius:10px;border:0;background:var(--acc);color:var(--on);margin-top:6px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two label{font-size:11px;color:var(--mute)}
#sheet{position:fixed;inset:0;background:#000b;display:none;z-index:9}#sheet.open{display:block}
.panel{background:var(--bg);max-width:560px;height:100%;margin:0 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 6px) 14px 20px}
.ph{display:flex;justify-content:space-between;align-items:center;min-height:34px;font-size:14px}.ph .x{width:auto;padding:0 6px;font-size:13px;color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;margin:8px 0}
.cat{background:none;border:0;color:var(--ink);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;cursor:pointer;text-align:center;overflow-wrap:anywhere;line-height:1.2}
.cat .ic{width:40px;height:40px;border-radius:13px;font-size:19px}.cat.on .ic{outline:2px solid var(--acc);outline-offset:2px}
.calc{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 10px);box-shadow:0 -10px 30px #0009;z-index:10}
.pk{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}.pk .i{color:var(--acc)}
.disp{font-size:24px;font-weight:600;text-align:right;padding:0 4px;min-height:34px;overflow:hidden}
.calc .f{margin-top:5px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.pad button{height:38px;font-size:17px;border:0;border-radius:10px;background:var(--s2);color:var(--ink);cursor:pointer;display:grid;place-items:center}.pad .ok{background:var(--acc);color:var(--on);font-weight:700}
.dn{display:flex;align-items:center;gap:14px;padding:12px 0 8px}.dn svg{width:42%;max-width:190px;flex:none}.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.lg>div{display:flex;align-items:center;gap:8px;font-size:12.5px}.lg .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg em{font-style:normal;color:var(--mute)}.dot{width:10px;height:10px;border-radius:50%;flex:none}.pb{display:flex;align-items:center;gap:8px;margin-top:6px}.pb i{display:block;height:5px;border-radius:3px;min-width:5px}.pb small{color:var(--mute);font-size:11px;white-space:nowrap}
.mu{color:var(--mute)}.er{color:var(--neg);font-size:12px;min-height:16px;margin-top:6px}.sh{margin:18px 0 2px;font-size:12px}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.lk{width:100%;max-width:320px;text-align:center}.lk>b{font-size:18px;display:block;margin:8px 0 14px}.lg2{font-size:34px;color:var(--acc);display:grid;place-items:center}
.icg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 4px}.pi{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--ink);cursor:pointer;padding:0}.pi.on{border-color:var(--acc);color:var(--acc);background:var(--s2)}
.cs{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.cs .cn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acts{display:flex}.acts .x{width:30px;height:30px;font-size:16px;color:var(--mute);padding:0}.acts .x:disabled{opacity:.25}
.stk{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
.stt{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:8px}
.ed{display:flex;align-items:center;gap:10px}.ed .ic{width:46px;height:46px;border-radius:14px;font-size:22px}.ed .f{margin-top:0}
.clg{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.cc{width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#14120a;font-size:14px;padding:0}
.gt{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 6px}
.pi.on{background:var(--sel,var(--acc));border-color:transparent;color:#14120a}
.dh{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 22px}.dh .ic{width:56px;height:56px;border-radius:18px;font-size:26px}.dh b{font-size:20px;font-weight:600}
.dl>div{display:flex;gap:16px;padding:14px 4px;border-top:1px solid var(--line)}.dl>div>span{width:84px;flex:none;color:var(--mute)}.dl>div>div{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}.dl small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.dbt{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);border-top:1px solid var(--line);z-index:10}.dbt .btn{margin:0}
.big{font-size:22px;font-weight:700;margin:2px 0 6px}
@media(max-width:350px){.hs b{font-size:14px}.hs>div{padding:0 2px}.cat{font-size:10px}.cat .ic{width:36px;height:36px}}
@media(max-height:600px){.pad button{height:34px}.disp{font-size:20px;min-height:28px}}
@media(min-width:600px){body{font-size:15px}}
</style>
</head>

    const m=S.tx.filter(t=>inP(t,"c")),e=tot(m,"exp"),i=tot(m,"inc"),b=S.budget,left=b-e,p=b?Math.min(100,e/b*100):0,R=44,C=2*Math.PI*R;

    <div class="card"><b>Ежемесячный бюджет</b><div class="row" style="margin-top:10px"><div style="flex:1"><div class="row"><span style="color:var(--mute)">Бюджет</span><span>${fmt(b)}</span></div><div class="row"><span style="color:var(--mute)">Расходы</span><span>${fmt(e)}</span></div><div class="row"><span style="color:var(--mute)">Остаток</span><b class="${left<0?"neg":""}">${fmt(left)}</b></div></div>
    <svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="${left<0?"var(--neg)":"var(--acc)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${p/100*C} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="60" text-anchor="middle" font-size="16" fill="currentColor">${b?Math.round(p)+"%":"—"}</text></svg></div>
    <button class="btn alt" id="setB">Настроить бюджет</button></div>`;
  }
  const A=S.acc.filter(a=>!a.debt).reduce((s,a)=>s+bal(a),0),D=-S.acc.filter(a=>a.debt).reduce((s,a)=>s+bal(a),0);
  return h+`<div class="card"><small style="color:var(--mute)">Чистые активы</small><div class="big">${fmt(A-D)}</div><div class="two"><div><small style="color:var(--mute)">Активы</small><div><b>${fmt(A)}</b></div></div><div><small style="color:var(--mute)">Обязательства</small><div><b>${fmt(D)}</b></div></div></div></div>
  <div class="two"><button class="btn alt" id="addAcc">Добавить счёт</button><button class="btn alt" id="mngAcc">Управление счетами</button></div>`+
  S.acc.map(a=>`<div class="cr"><div class="ic" style="--c:${col(a.name)}">${svg(a.debt?"card":"wallet")}</div><div>${esc(a.name)}<br><small style="color:var(--mute)">${a.debt?"Обязательство":"Актив"}</small></div><b>${fmt(a.debt?-bal(a):bal(a))}</b></div>`).join("");
}

function openSheet(edit){
  let kind=edit?edit.kind:"exp",cat=edit?edit.cat:cats("exp")[0][0],expr=edit?String(edit.amt):"",date=edit?edit.date:today(),note=edit?edit.note||"":"",acc=edit?edit.acc:null,to=edit?edit.to:null,pick=!!edit;
  const opts=(sel,none)=>(none?`<option value="">${none}</option>`:"")+S.acc.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)}</option>`).join("");
  const keep=()=>{const n=$("#note");if(n){note=n.value;date=$("#dt").value||date}const a=$("#sa");if(a)acc=+a.value||null;const t=$("#st");if(t)to=+t.value||null};
  const draw=()=>{
    const st=$("#panel").scrollTop,show=pick||kind==="tr";
    modal(`<div class="ph"><button class="x" id="cn">Отмена</button><b>${edit?"Изменить":"Добавить"}</b><span></span></div>
    <div class="seg">${[["exp","Расход"],["inc","Доход"],["tr","Перевод"]].map(([k,l])=>`<button data-k="${k}" class="${kind===k?"on":""}">${l}</button>`).join("")}</div>
    ${kind==="tr"?`<div class="two"><label>Откуда<select class="f" id="sa">${opts(acc,"Выбрать")}</select></label><label>Куда<select class="f" id="st">${opts(to,"Выбрать")}</select></label></div>`
    :`<div class="cats">${cats(kind).map(c=>`<button class="cat ${pick&&c[0]===cat?"on":""}" data-c="${esc(c[0])}"><span class="ic" style="--c:${col(c[0])}">${svg(c[1])}</span>${esc(c[0])}</button>`).join("")}<button class="cat" id="newc"><span class="ic" style="--c:#a3adbb">${svg("sliders")}</span>Настройки</button></div>`}
    ${show?`<div class="calc"><div class="row"><span class="pk">${kind==="tr"?svg("swap")+"Перевод":icon(kind,cat)+esc(cat)}</span>${kind==="tr"?"":`<button class="x" id="hide" aria-label="Скрыть калькулятор">${svg("x")}</button>`}</div>
    <div class="disp" id="disp">${expr||"0"}</div>
    <input class="f" id="note" placeholder="Заметка" maxlength="80" value="${esc(note)}">
    <div class="two"><input class="f" type="date" id="dt" value="${date}">${kind==="tr"?"<span></span>":`<select class="f" id="sa">${opts(acc,"Без счёта")}</select>`}</div>
    <div class="pad">${["7","8","9","⌫","4","5","6","+","1","2","3","−",".","0","00","="].map(k=>`<button data-n="${k}" class="${k==="="?"ok":""}">${k==="⌫"?svg("back"):k}</button>`).join("")}</div>
    ${edit?`<button class="btn alt" id="del">Удалить запись</button>`:""}</div>`:""}`);
    {const c=$(".calc");$("#panel").style.paddingBottom=c?c.offsetHeight+16+"px":""}$("#panel").scrollTop=st;
    $("#cn").onclick=close;
    const hd=$("#hide");if(hd)hd.onclick=()=>{keep();pick=false;draw()};
    $$("[data-k]").forEach(b=>b.onclick=()=>{keep();kind=b.dataset.k;cat=cats(kind)[0][0];pick=false;draw()});
    $$("[data-c]").forEach(b=>b.onclick=()=>{keep();cat=b.dataset.c;pick=true;draw()});
    const nc=$("#newc");if(nc)nc.onclick=()=>{keep();catSettings(kind,()=>{if(!cats(kind).some(c=>c[0]===cat)){cat=cats(kind)[0][0];pick=false}draw()})};
    $$("[data-n]").forEach(b=>b.onclick=()=>key(b.dataset.n));
    if(edit)$("#del").onclick=()=>{S.tx=S.tx.filter(t=>t.id!==edit.id);save();close();render()};
  };
  const calc=()=>{const s=expr.replace(/−/g,"-");if(!/^-?[\d.]+([+\-][\d.]+)*$/.test(s))return null;const n=s.match(/-?[\d.]+/g).reduce((a,b)=>a+parseFloat(b),0);return isFinite(n)?Math.round(n*100)/100:null};
  const key=k=>{
    if(k==="⌫")expr=expr.slice(0,-1);
    else if(k==="="){
      const v=calc();if(v===null)return;
      if(/[+−]/.test(expr.slice(1))){expr=String(v);$("#disp").textContent=expr;return}
      if(v<=0)return;keep();
      if(kind==="tr"&&(!acc||!to||acc===to)){alert("Выберите два разных счёта.");return}
      const rec={kind,cat:kind==="tr"?null:cat,amt:v,date,note,acc,to:kind==="tr"?to:null};
      if(edit)Object.assign(edit,rec);else S.tx.push({id:Date.now(),...rec});
      save();close();render();return;
    }else if("+−".includes(k)){if(!expr||/[+−]$/.test(expr))return;expr+=k}
    else expr+=k;
    $("#disp").textContent=expr||"0";
  };
  draw();
}

const ICON_GROUPS=[["Развлечения",["game","music","film","mic","headphones","camera","dice","star","tv"]],["Еда",["food","coffee","glass","cake","apple","cherry","carrot","snack"]],["Финансы",["coin","wallet","card","bank","bars","trend","shield","case","trophy","piggy"]],["Спорт",["sport","bike","ball"]],["Дом и быт",["home","sofa","bed","bulb","key","wrench","bolt","leaf","paw","baby"]],["Транспорт",["bus","car","plane","fuel","pin"]],["Люди и здоровье",["people","smile","heart","pill","hand"]],["Покупки и другое",["cart","bag","shirt","gift","scissors","phone","monitor","edu","book","globe","mail","clock","cig","tag","box"]]];
function catSettings(kind0,done){
  let kind=kind0;
  const draw=()=>{
    const L=S.cat[kind];
    modal(`<div class="ph"><button class="x" id="cn" aria-label="Назад" style="font-size:20px">${svg("left")}</button><b>Категории</b><span style="width:34px"></span></div>
    <div class="seg"><button data-k="exp" class="${kind==="exp"?"on":""}">Расход</button><button data-k="inc" class="${kind==="inc"?"on":""}">Доход</button></div>
    ${L.map((c,i)=>`<div class="cs"><div class="ic" style="--c:${c.c}">${svg(c.i)}</div><div class="cn2">${esc(c.n)}</div><div class="acts"><button class="x" data-up="${i}" ${i?"":"disabled"} aria-label="Выше">${svg("up")}</button><button class="x" data-dn="${i}" ${i<L.length-1?"":"disabled"} aria-label="Ниже">${svg("down")}</button><button class="x" data-ed="${i}" aria-label="Изменить">${svg("edit")}</button><button class="x" data-rm="${i}" aria-label="Удалить">${svg("trash")}</button></div></div>`).join("")}
    <div class="stk"><button class="btn" id="addc">Добавить категорию</button></div>`);
    $("#cn").onclick=()=>{if(done)done()};
    $$("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k;draw()});
    $$("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;const t=L[i-1];L[i-1]=L[i];L[i]=t;save();draw()});
    $$("[data-dn]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;const t=L[i+1];L[i+1]=L[i];L[i]=t;save();draw()});
    $$("[data-ed]").forEach(b=>b.onclick=()=>catEditor(kind,L[+b.dataset.ed],draw));
    $$("[data-rm]").forEach(b=>b.onclick=()=>{
      const c=L[+b.dataset.rm];
      if(L.length<2){alert("Нужна хотя бы одна категория.");return}
      if(confirm("Удалить категорию «"+c.n+"»? Старые записи с ней сохранятся.")){S.cat[kind]=L.filter(x=>x!==c);save();draw()}});
    $("#addc").onclick=()=>catEditor(kind,null,draw);
  };
  draw();
}
function catEditor(kind0,ex,back){
  let kind=kind0,ic=ex?ex.i:"tag",clr=ex?ex.c:COLORS[Math.floor(Math.random()*COLORS.length)];
  modal(`<div class="stt"><div class="ph"><button class="x" id="cn">Отмена</button><b>${ex?"Изменить категорию":"Добавить категорию"}</b><button class="x" id="sv" aria-label="Сохранить" style="color:var(--acc);font-size:20px">${svg("check")}</button></div>
  ${ex?"":`<div class="seg"><button data-k="exp" class="${kind==="exp"?"on":""}">Расход</button><button data-k="inc" class="${kind==="inc"?"on":""}">Доход</button></div>`}
  <div class="ed"><div class="ic" id="pv"></div><input class="f" id="nm" placeholder="Название категории" maxlength="20" value="${ex?esc(ex.n):""}"></div>
  <div class="clg">${COLORS.map(c=>`<button class="cc" data-cl="${c}" style="background:${c}" aria-label="Цвет"></button>`).join("")}</div><p class="er" id="er"></p></div>
  ${ICON_GROUPS.map(([t,l])=>`<div class="gt">${t}</div><div class="icg">${l.map(k=>`<button class="pi" data-pi="${k}" aria-label="Иконка">${svg(k)}</button>`).join("")}</div>`).join("")}`);
  $("#panel").scrollTop=0;
  const upd=()=>{
    $("#pv").style.setProperty("--c",clr);$("#pv").innerHTML=svg(ic);
    $("#panel").style.setProperty("--sel",clr);
    $$("[data-cl]").forEach(b=>b.innerHTML=b.dataset.cl===clr?svg("check"):"");
    $$("[data-pi]").forEach(b=>b.classList.toggle("on",b.dataset.pi===ic));
  };
  upd();
  $("#cn").onclick=()=>{if(back)back()};
  $$("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k;$$("[data-k]").forEach(x=>x.classList.toggle("on",x===b))});
  $$("[data-cl]").forEach(b=>b.onclick=()=>{clr=b.dataset.cl;upd()});
  $$("[data-pi]").forEach(b=>b.onclick=()=>{ic=b.dataset.pi;upd()});
  $("#sv").onclick=()=>{
    const n=$("#nm").value.trim(),e=$("#er");
    if(!n){e.textContent="Введите название.";return}
    if(S.cat[kind].some(c=>c!==ex&&c.n.toLowerCase()===n.toLowerCase())){e.textContent="Такая категория уже есть.";return}
    if(ex){if(ex.n!==n)S.tx.forEach(t=>{if(t.kind===kind&&t.cat===ex.n)t.cat=n});ex.n=n;ex.i=ic;ex.c=clr}
    else S.cat[kind].push({n,i:ic,c:clr});
    save();if(back)back();
  };
}

/* ---------- копилка ---------- */
const num=v=>Math.max(0,parseFloat(String(v||"").replace(",","."))||0);
function goalsView(){
  const T=S.goals.reduce((a,g)=>a+g.saved,0);
  let h=`<div class="card"><small class="mu">Всего в копилке</small><div class="big">${fmt(T)}</div></div><button class="btn" id="addG">Новая цель</button>`;
  if(!S.goals.length)h+=`<div class="empty">Целей пока нет.<br>Создайте первую, например «Отпуск» или «Новый телефон».</div>`;
  return h+S.goals.map(g=>{const p=g.target?Math.min(100,g.saved/g.target*100):0;
    return`<div class="card"><div class="row"><b>${esc(g.name)}</b><button class="x" data-ge="${g.id}" aria-label="Изменить цель">${svg("more")}</button></div>
    <div class="row" style="margin-top:4px"><span>${fmt(g.saved)}${g.target?" из "+fmt(g.target):""}</span><small class="mu">${g.target?pc(p):""}</small></div>
    ${g.target?`<div class="bar"><i style="width:${p}%;background:var(--acc)"></i></div>`:""}
    <div class="two" style="margin-top:10px"><button class="btn alt" data-gp="${g.id}" style="margin:0">Пополнить</button><button class="btn alt" data-gm="${g.id}" style="margin:0">Снять</button></div></div>`}).join("");
}
function goalForm(g){
  modal(`<div class="ph"><button class="x" id="cn">Отмена</button><b>${g?"Цель":"Новая цель"}</b><span></span></div>
  <input class="f" id="gn" placeholder="Название" maxlength="30" value="${g?esc(g.name):""}">
  <input class="f" id="gt" inputmode="decimal" placeholder="Сумма цели (необязательно)" value="${g&&g.target?g.target:""}">
  ${g?"":`<input class="f" id="gs" inputmode="decimal" placeholder="Уже накоплено">`}
  <button class="btn" id="ok">Сохранить</button>${g?`<button class="btn alt" id="dl">Удалить цель</button>`:""}`);
  $("#cn").onclick=close;
  $("#ok").onclick=()=>{const n=$("#gn").value.trim();if(!n)return;const t=num($("#gt").value);
    if(g){g.name=n;g.target=t}else S.goals.push({id:Date.now(),name:n,target:t,saved:num($("#gs").value)});
    save();close();render()};
  if(g)$("#dl").onclick=()=>{if(confirm("Удалить цель вместе с накоплениями?")){S.goals=S.goals.filter(x=>x!==g);save();close();render()}};
}
function goalMove(g,sign){
  if(!g)return;
  modal(`<div class="ph"><button class="x" id="cn">Отмена</button><b>${sign>0?"Пополнить":"Снять"}: ${esc(g.name)}</b><span></span></div>
  <input class="f" id="ga" inputmode="decimal" placeholder="Сумма"><p class="er" id="er"></p><button class="btn" id="ok">Готово</button>`);
  $("#cn").onclick=close;
  $("#ok").onclick=()=>{const v=num($("#ga").value);if(!v)return;
    if(sign<0&&v>g.saved){$("#er").textContent="В копилке меньше этой суммы.";return}
    g.saved=Math.round((g.saved+sign*v)*100)/100;save();close();render()};
}

/* ---------- резервная копия ---------- */
function backup(){
  const d={app:"finansy",v:2,date:new Date().toISOString(),data:{tx:S.tx,acc:S.acc,budget:S.budget,cat:S.cat,goals:S.goals,theme:S.theme}};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));
  a.download="finansy-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result),d=j.data;
    if(j.app!=="finansy"||!d||!Array.isArray(d.tx))throw 0;
    if(!confirm("Заменить данные на этом устройстве данными из копии ("+d.tx.length+" записей)?"))return;
    S.tx=d.tx;S.acc=Array.isArray(d.acc)?d.acc:[];S.budget=+d.budget||0;if(d.cat&&Array.isArray(d.cat.exp)&&Array.isArray(d.cat.inc))S.cat=d.cat;else S.cat=defaultCats(d.cx,d.ci);S.cx=[];S.ci=[];S.goals=Array.isArray(d.goals)?d.goals:[];
    if(d.theme==="light"||d.theme==="dark"){S.theme=d.theme;document.documentElement.dataset.t=S.theme}
    save();render();alert("Данные восстановлены.");
  }catch(e){alert("Этот файл не похож на резервную копию «Финансов».")}};
  r.readAsText(file);
}

/* ---------- пароль и отпечаток ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const t=salt+"|"+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h1=0x811c9dc5,h2=5381;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=(Math.imul(h2,33)^c)>>>0}
  return"f"+h1.toString(16)+h2.toString(16);
}
function pwForm(){
  const has=!!S.sec.hash;
  modal(`<div class="ph"><button class="x" id="cn">Отмена</button><b>${has?"Смена пароля":"Новый пароль"}</b><span></span></div>
  ${has?`<input class="f" id="p0" type="password" placeholder="Текущий пароль" autocomplete="current-password">`:""}
  <input class="f" id="p1" type="password" placeholder="Новый пароль (от 4 символов)" autocomplete="new-password">
  <input class="f" id="p2" type="password" placeholder="Повторите пароль" autocomplete="new-password">
  <p class="er" id="er"></p><button class="btn" id="ok">Сохранить</button>`);
  $("#cn").onclick=close;
  $("#ok").onclick=async()=>{
    const e=$("#er");
    if(has&&await hashPw($("#p0").value,S.sec.salt)!==S.sec.hash){e.textContent="Текущий пароль неверный.";return}
    const a=$("#p1").value;
    if(a.length<4){e.textContent="Пароль должен быть не короче 4 символов.";return}
    if(a!==$("#p2").value){e.textContent="Пароли не совпадают.";return}
    const salt=b64(crypto.getRandomValues(new Uint8Array(12)));
    S.sec.salt=salt;S.sec.hash=await hashPw(a,salt);save();close();render();
  };
}
function pwOff(){
  modal(`<div class="ph"><button class="x" id="cn">Отмена</button><b>Убрать пароль</b><span></span></div>
  <input class="f" id="p0" type="password" placeholder="Текущий пароль" autocomplete="current-password"><p class="er" id="er"></p><button class="btn" id="ok">Убрать пароль</button>`);
  $("#cn").onclick=close;
  $("#ok").onclick=async()=>{
    if(await hashPw($("#p0").value,S.sec.salt)!==S.sec.hash){$("#er").textContent="Пароль неверный.";return}
    S.sec={};save();close();render();
  };
}
async function bioOn(){
  if(!window.PublicKeyCredential||!navigator.credentials){alert("Этот браузер не поддерживает вход по отпечатку.");return}
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Финансы"},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"user",displayName:"Пользователь"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
    S.sec.bio=b64(cred.rawId);save();render();
  }catch(e){alert("Не удалось включить отпечаток. Нужен сайт по https и отпечаток или блокировка экрана, настроенные на телефоне.")}
}
async function bioLogin(){
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:"public-key",id:unb64(S.sec.bio),transports:["internal"]}],userVerification:"required",timeout:60000}});
    unlock();
  }catch(e){}
}
let locked=false,hiddenAt=0;
function lockNow(){
  if(!S.sec.hash)return;
  locked=true;close();$("#lock").hidden=false;$("#lp").value="";$("#le").textContent="";$("#lb").hidden=!S.sec.bio;
  if(S.sec.bio)setTimeout(bioLogin,300);
}
const LOCK_MS=3*60000;
function stamp(){if(!locked)try{sessionStorage.setItem("finansy.ok",String(Date.now()))}catch(e){}}
function unlock(){locked=false;$("#lock").hidden=true;stamp()}
$("#lo").onclick=async()=>{
  if(await hashPw($("#lp").value,S.sec.salt)===S.sec.hash)unlock();
  else{$("#le").textContent="Неверный пароль";$("#lp").value=""}
};
$("#lp").onkeydown=e=>{if(e.key==="Enter")$("#lo").click()};
$("#lb").onclick=bioLogin;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();saveUI();stamp()}
  else if(S.sec.hash&&!locked&&Date.now()-hiddenAt>LOCK_MS)lockNow();
});
let _st;addEventListener("scroll",()=>{clearTimeout(_st);_st=setTimeout(saveUI,300)},{passive:true});
addEventListener("pagehide",()=>{saveUI();stamp()});

$$("[data-i]").forEach(e=>e.innerHTML=svg(e.dataset.i));
render();
if(S.sec.hash){let t=0;try{t=+sessionStorage.getItem("finansy.ok")||0}catch(e){}if(Date.now()-t>LOCK_MS)lockNow()}
requestAnimationFrame(()=>window.scrollTo(0,U.y||0));
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
